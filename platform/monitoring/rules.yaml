---
# Prometheus alert rules (mounted into Prometheus by platform/monitoring/prometheus.yaml).
# Unit-tested with promtool: tests/prometheus/rules.test.yaml
groups:
  - name: supply-chain
    rules:
      # Kyverno refused a workload in an enforcing namespace (unsigned/tampered image, foreign
      # registry, unsafe pod spec...). In a healthy pipeline this does not happen, so even one counts.
      # Kyverno creates a counter series on the first refusal of a kind, already at its value, and
      # increase() cannot see that first step. Series that did not exist 10 minutes ago therefore count
      # with their full value (`* 1` drops the metric name so `or` can match increase()'s output).
      # That branch is skipped during Prometheus' first 10 minutes, when every series looks new.
      # Both webhook phases count: signature checks run in the mutating phase (the image is rewritten to
      # its digest there), so unsigned or imposter images are refused as MutatingWebhookConfiguration.
      # A request is refused in one phase only, so nothing is counted twice.
      - alert: UntrustedWorkloadBlocked
        expr: >-
          sum by (resource_namespace, resource_kind) (
            (
              (kyverno_admission_requests_total{request_allowed="false", resource_namespace="prod"}
                unless kyverno_admission_requests_total{request_allowed="false", resource_namespace="prod"} offset 10m) * 1
              and on () (time() - process_start_time_seconds{job="prometheus"} > 600)
            )
            or
            increase(kyverno_admission_requests_total{request_allowed="false", resource_namespace="prod"}[10m])
          ) > 0
        labels:
          severity: critical
        annotations:
          summary: "Kyverno blocked {{ $value | printf \"%.0f\" }} {{ $labels.resource_kind }} request(s) in {{ $labels.resource_namespace }} (10 min)"
          description: "Someone or something tried to run an untrusted or unsafe workload. See: kubectl get events -n {{ $labels.resource_namespace }} --field-selector reason=PolicyViolation"

      # A running image has (newly published) CRITICAL vulnerabilities. Trivy Operator re-scans
      # running workloads, so this catches CVEs that did not exist at build time.
      - alert: RunningImageHasCriticalVulnerabilities
        expr: sum by (namespace, image_repository, image_tag, image_digest) (trivy_image_vulnerabilities{severity="Critical"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}: {{ $labels.image_repository }} has {{ $value }} CRITICAL vulnerabilities"
          description: "Rebuild and release (the pipeline will refuse to sign while they remain), or accept the risk explicitly."

      - alert: AdmissionControllerDown
        expr: absent(up{job="kyverno-admission"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Kyverno admission controller is not scraped / not running"
          description: "With failurePolicy=Fail new pods cannot be created; with Ignore they would not be verified. Check kyverno pods."
